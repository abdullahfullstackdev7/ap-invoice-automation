[project]
name = "ap-automation-backend"
version = "0.1.0"
description = "Accounts payable invoice processing and 3-way match automation, backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "email-validator>=2.2",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
    "procrastinate>=3.10",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.12",
    "python-magic-bin>=0.4.14; platform_system == 'Windows'",
    "python-magic>=0.4.27; platform_system != 'Windows'",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "img2pdf>=0.5",
    "opencv-python-headless>=4.10",
    "rapidocr-onnxruntime>=1.4",
    "pytesseract>=0.3.13",
    "rapidfuzz>=3.10",
    "scipy>=1.14",
    "python-dateutil>=2.9",
    "babel>=2.16",
    "price-parser>=0.3.4",
    "openai>=1.52",
    "google-genai>=0.3",
    "tenacity>=9.0",
    "httpx>=0.27",
    "structlog>=24.4",
    "pyotp>=2.9",
    "pgvector>=0.3",
    "fastembed>=0.4",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is idiomatic.

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "locust>=2.46.7",
    "pytest-cov>=7.1.0",
    "schemathesis>=4.29.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
