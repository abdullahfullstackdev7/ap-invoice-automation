name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  long-dash-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if the long dash character (U+2014) appears anywhere in the repo
        run: |
          if grep -rP "\x{2014}" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist .; then
            echo "Long dash character (U+2014) found. Replace it with a hyphen, comma, colon or a new sentence."
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: apdb
          POSTGRES_USER: apdb_admin
          POSTGRES_PASSWORD: change_me_admin
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U apdb_admin -d apdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql+psycopg://apdb_admin:change_me_admin@localhost:5433/apdb
      DATABASE_URL: postgresql+psycopg://app_rw:change_me@localhost:5433/apdb
      DB_APP_RW_PASSWORD: change_me
      DB_APP_RO_PASSWORD: change_me_ro
      TEST_DATABASE_URL: postgresql+asyncpg://app_rw:change_me@localhost:5433/apdb
      TEST_DATABASE_ADMIN_URL: postgresql+asyncpg://apdb_admin:change_me_admin@localhost:5433/apdb
      JWT_SECRET: ci_only_test_secret_at_least_32_characters_long
    steps:
      - uses: actions/checkout@v4
      - name: Install system OCR/image dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libgl1 libmagic1
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy app tests scripts
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - run: uv run bandit -r app -q
      - run: uv run pip-audit --strict || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high || true

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ap-automation-backend ./backend
      - name: Build frontend image
        run: docker build -t ap-automation-frontend ./frontend
