services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: apdb
      POSTGRES_USER: apdb_admin
      POSTGRES_PASSWORD: change_me_admin
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apdb_admin -d apdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app_rw:change_me@db:5432/apdb
      DATABASE_ADMIN_URL: postgresql+psycopg://apdb_admin:change_me_admin@db:5432/apdb
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./dataset:/dataset
      - files_data:/data/files
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app_rw:change_me@db:5432/apdb
      DATABASE_ADMIN_URL: postgresql+psycopg://apdb_admin:change_me_admin@db:5432/apdb
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - files_data:/data/files
    command: python -m app.workers.run

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    profiles: ["clamav"]
    ports:
      - "3310:3310"

volumes:
  db_data:
  files_data:
